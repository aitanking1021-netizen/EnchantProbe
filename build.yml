name: Build EnchantProbe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build libEnchantProbe.so
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CXX -std=c++17 -O2 -fPIC -shared -fvisibility=hidden -static-libstdc++ \
            -Wl,--gc-sections -s -o libEnchantProbe.so probe.cpp -llog

      - name: Package .levipack
        run: |
          mkdir -p pkg/enchantprobe
          cp libEnchantProbe.so pkg/enchantprobe/
          cat > pkg/enchantprobe/manifest.json <<'JSON'
          {
            "type": "preload-native",
            "entry": "libEnchantProbe.so",
            "name": "EnchantProbe",
            "author": "EnchantProbe",
            "version": "1.0.0",
            "minecraft_versions": []
          }
          JSON
          (cd pkg && zip -r ../EnchantProbe.levipack enchantprobe)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EnchantProbe
          path: |
            EnchantProbe.levipack
            libEnchantProbe.so
