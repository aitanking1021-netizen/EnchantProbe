name: Build EnchantBoost

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build libEnchantBoost.so
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CXX -std=c++17 -O2 -fPIC -shared -fvisibility=hidden -static-libstdc++ \
            -Wl,--gc-sections -s -o libEnchantBoost.so boost.cpp -llog

      - name: Package .levipack
        run: |
          mkdir -p pkg/enchantboost
          cp libEnchantBoost.so pkg/enchantboost/
          cat > pkg/enchantboost/manifest.json <<'JSON'
          {
            "type": "preload-native",
            "entry": "libEnchantBoost.so",
            "name": "EnchantBoost",
            "author": "EnchantBoost",
            "version": "1.0.0",
            "minecraft_versions": []
          }
          JSON
          (cd pkg && zip -r ../EnchantBoost.levipack enchantboost)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EnchantBoost
          path: |
            EnchantBoost.levipack
            libEnchantBoost.so
