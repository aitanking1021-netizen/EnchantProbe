name: Build EnchantAttrProbe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build libEnchantAttrProbe.so
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CXX -std=c++17 -O2 -fPIC -shared -fvisibility=hidden -static-libstdc++ \
            -Wl,--gc-sections -s -o libEnchantAttrProbe.so attr_probe.cpp -llog

      - name: Package .levipack
        run: |
          mkdir -p pkg/enchantattrprobe
          cp libEnchantAttrProbe.so pkg/enchantattrprobe/
          cat > pkg/enchantattrprobe/manifest.json <<'JSON'
          {
            "type": "preload-native",
            "entry": "libEnchantAttrProbe.so",
            "name": "EnchantAttrProbe",
            "author": "EnchantAttrProbe",
            "version": "1.0.0",
            "minecraft_versions": []
          }
          JSON
          (cd pkg && zip -r ../EnchantAttrProbe.levipack enchantattrprobe)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EnchantAttrProbe
          path: |
            EnchantAttrProbe.levipack
            libEnchantAttrProbe.so
