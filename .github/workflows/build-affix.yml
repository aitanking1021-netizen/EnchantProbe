name: Build EnchantAffix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build libEnchantAffix.so
        run: |
          CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CXX -std=c++17 -O2 -fPIC -shared -fvisibility=hidden -static-libstdc++ \
            -Wl,--gc-sections -s -o libEnchantAffix.so affix.cpp -llog

      - name: Package .levipack
        run: |
          mkdir -p pkg/enchantaffix
          cp libEnchantAffix.so pkg/enchantaffix/
          cat > pkg/enchantaffix/manifest.json <<'JSON'
          {
            "type": "preload-native",
            "entry": "libEnchantAffix.so",
            "name": "EnchantAffix",
            "author": "EnchantAffix",
            "version": "1.0.0",
            "minecraft_versions": []
          }
          JSON
          (cd pkg && zip -r ../EnchantAffix.levipack enchantaffix)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EnchantAffix
          path: |
            EnchantAffix.levipack
            libEnchantAffix.so
